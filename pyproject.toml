[project]
name = "song2notes"
version = "0.1.0"
description = "Extract vocal melody and drum hit notes (as MIDI) from a song file."
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "demucs>=4.0",
    "basic-pitch>=0.4",
    "librosa>=0.10",
    "pretty_midi>=0.2.10",
    "numpy>=1.24,<2",
    "soundfile>=0.12",
]

[project.scripts]
song2notes = "song2notes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["song2notes*"]
